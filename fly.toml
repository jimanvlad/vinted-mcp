# Fly.io config for the Vinted deal finder.
# Set the secret before (or right after) the first deploy:
#   fly secrets set VINTED_MCP_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
app = "vinted-deals-154730"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  VINTED_MCP_TRANSPORT = "http"
  PORT = "8000"
  VINTED_WISHLIST_PATH = "/data/wishlist.json"
  VINTED_DOMAIN = "www.vinted.co.uk"

# Keeps the shopping list across restarts and deploys.
[[mounts]]
  source = "vinted_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Sleep when idle and wake on the next request, so it costs almost nothing.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
