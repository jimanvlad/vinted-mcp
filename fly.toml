# fly.toml app configuration file generated for vinted-mcp on 2026-11-26T17:35:31Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'vinted-mcp'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  VINTED_DOMAIN = 'www.vinted.co.uk'
  VINTED_MCP_TRANSPORT = 'http'
  VINTED_WISHLIST_PATH = '/data/wishlist.json'

[[mounts]]
  source = 'vinted_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000  # must match PORT
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
