[project]
name = "vinted-mcp"
version = "0.1.0"
description = "Read-only MCP server that finds second-hand deals on Vinted for a shopping list"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vinted-mcp = "vinted_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_mcp"]
